name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: popularia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, opcache, zip, apcu
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --no-progress --no-scripts

      # O PdfValidator usa qpdf para detectar corrupção e senha; o Dockerfile
      # já instala o binário, mas o runner do GitHub Actions não o traz.
      - name: Instalar utilitários de PDF
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Diagnóstico do PDF (temporário)
        run: |
          id
          umask
          ls -ln /usr/bin/qpdf
          set +e
          echo "--- workspace fixture ---"
          qpdf --check tests/Library/fixtures/valid.pdf; echo "workspace-qpdf=$?"
          mkdir -p var/tmp
          cp tests/Library/fixtures/valid.pdf var/tmp/test.pdf
          chmod 0644 var/tmp/test.pdf
          echo "--- var/tmp copy ---"
          qpdf --check var/tmp/test.pdf; echo "var-qpdf=$?"
          php -r '$p = tempnam(sys_get_temp_dir(), "pdf-"); file_put_contents($p, file_get_contents("tests/Library/fixtures/valid.pdf")); file_put_contents("/tmp/php-pdf-path", $p); echo $p, PHP_EOL;'
          p="$(cat /tmp/php-pdf-path)"
          ls -ln "$p"
          echo "--- /tmp copy ---"
          qpdf --check "$p"; echo "php-temp-qpdf=$?"

      - name: Verificar estilo de código
        run: composer cs

      - name: Análise estática (PHPStan)
        run: composer stan

      - name: Análise estática (Psalm)
        run: composer psalm

      - name: Testes
        env:
          # A suíte usa o sufixo _test → banco efetivo: popularia_test
          # postgres é superusuário e pode executar CREATE EXTENSION (unaccent, pg_trgm).
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/popularia?serverVersion=18&charset=utf8"
          APP_SECRET: "ci-secret-not-for-production-00000000000000"
        run: composer test

      - name: Cobertura
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/popularia?serverVersion=18&charset=utf8"
          APP_SECRET: "ci-secret-not-for-production-00000000000000"
        run: |
          mkdir -p var/coverage
          php -d pcov.enabled=1 bin/phpunit --coverage-text --coverage-clover=var/coverage/clover.xml

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-php
          path: var/coverage/clover.xml
          if-no-files-found: error

      - name: Auditoria de dependências
        run: composer audit
