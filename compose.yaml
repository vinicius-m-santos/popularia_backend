# Ambiente de desenvolvimento local: API, PostgreSQL e captura de e-mails.
# Uso: docker compose up -d --build  (veja README.md)
# As senhas abaixo são só para desenvolvimento local; produção usa variáveis próprias.

services:
  php:
    build:
      context: .
      target: dev
    environment:
      SERVER_NAME: ":80"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-popularia}:${POSTGRES_PASSWORD:-popularia_dev}@database:5432/${POSTGRES_DB:-popularia}?serverVersion=18&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    volumes:
      - ./:/app
      # Cache e logs do Symfony num volume do Docker: no Windows/macOS, gravar muitos arquivos
      # pequenos no diretório montado é lento. Logs: docker compose exec php tail -f var/log/dev.log
      - php_var:/app/var
    ports:
      # 0.0.0.0 para o celular na mesma rede Wi-Fi alcançar a API (EXPO_PUBLIC_API_URL=http://<ip-do-computador>:8080).
      - "${API_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-popularia}
      POSTGRES_USER: ${POSTGRES_USER:-popularia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popularia_dev}
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      # Só na máquina local, para ferramentas como psql/DBeaver.
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailer:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  database_data:
  php_var:
