security:
    # Algoritmo recomendado pelo Symfony ("auto": hoje bcrypt/argon2id conforme disponível,
    # com rehash automático quando a recomendação mudar).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Papéis da plataforma. Ninguém escolhe o próprio papel: só o comando app:user:set-role muda isso.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_PLATFORM_MODERATOR]
        ROLE_PLATFORM_MODERATOR: [ROLE_USER]

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|_error)/
            security: false
        api:
            pattern: ^/
            stateless: true
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            # Access token opaco (Authorization: Bearer ...), conferido no banco a cada requisição.
            # Veja docs/seguranca.md: "Por que tokens opacos".
            access_token:
                token_handler: App\Security\AccessTokenHandler
                failure_handler: App\Security\ApiAuthenticationFailureHandler
            entry_point: App\Security\ApiAuthenticationFailureHandler

    # Primeira linha de defesa; cada operação também declara sua regra de segurança.
    access_control:
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1/me, roles: ROLE_USER }
        - { path: ^/api/v1/auth/logout, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hash mais barato só nos testes, para a suíte rodar rápido.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
