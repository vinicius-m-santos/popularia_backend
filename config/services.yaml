# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.access_token_ttl: '%env(int:ACCESS_TOKEN_TTL)%'
    app.refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'
    app.security_event_retention_days: '%env(int:SECURITY_EVENT_RETENTION_DAYS)%'
    app.empty_string: ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            int $accessTokenTtl: '%app.access_token_ttl%'
            int $refreshTokenTtl: '%app.refresh_token_ttl%'
            int $securityEventRetentionDays: '%app.security_event_retention_days%'
            string $appSecret: '%kernel.secret%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'
            - '../src/Enum/'

    App\Library\LocalFilesystemStorage:
        arguments:
            $root: '%kernel.project_dir%/var/library'

    App\Library\ObjectStorage: '@App\Library\S3Storage'

    App\Mail\StagingMailGuard:
        arguments:
            $allowlist: '%env(default:app.empty_string:MAILER_STAGING_ALLOWLIST)%'

when@dev:
    services:
        App\Library\ObjectStorage: '@App\Library\LocalFilesystemStorage'
        App\Api\Library\LocalFileController:
            arguments:
                $appSecret: '%kernel.secret%'
