        public: true
    App\Library\ObjectStorage: '@App\Tests\Library\MemoryStorage'

    # Stubs dos validadores JWT para não chamar APIs externas nos testes.
    App\Tests\Social\FakeGoogleTokenValidator:
        public: true
        autowire: false
