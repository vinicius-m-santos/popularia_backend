# Configuração do serviço backend na Railway.
# Veja docs/infraestrutura.md para instruções completas de setup.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildTarget = "prod"

[deploy]
startCommand = "sh /app/docker/start.sh"
healthcheckPath = "/api/health"
# Tempo máximo para a aplicação responder ao primeiro healthcheck após o deploy.
# Cobre: build da imagem, warmup do cache, migrations, startup do FrankenPHP.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
